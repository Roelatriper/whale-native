name: macOS native checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-14
    timeout-minutes: 20
    env:
      TMPDIR: /private/tmp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
      - name: Verify runner architecture
        run: test "$(uname -m)" = arm64
      - name: Report Swift toolchain
        run: xcrun swiftc --version
      - run: npm test
      - run: npm run native:scan-memory
      - run: npm run release:build
      - run: npm run release:verify
